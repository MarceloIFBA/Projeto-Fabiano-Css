<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/altsenha.css">
    <link rel="stylesheet" href="style/altsenha.js">
    <title>Document</title>
</head>
<body>
    
    <header>
        <div class="logo">
            <img src="logo.png" alt="GamesGalaxy">
        </div>
        <nav class="menu">
            <ul>
                <li><a href="home.html">Página Inicial</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="suporte.html">Suporte</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="alterar-senha">
            <h2>Alterar Senha</h2>
            <form action="#" method="POST">
                <div class="campo">
                    <label for="senha-atual">Senha Atual:</label>
                    <input type="password" id="senha-atual" name="senha-atual" required>
                </div>
                <div class="campo">
                    <label for="nova-senha">Nova Senha:</label>
                    <input type="password" id="nova-senha" name="nova-senha" required>
                </div>
                <div class="campo">
                    <label for="confirmar-senha">Confirmar Nova Senha:</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" required>
                </div>
                <button type="submit" class="botao">Alterar Senha</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 GamesGalaxy. Todos os direitos reservados.</p>
    </footer>
    
</body>
</html>
