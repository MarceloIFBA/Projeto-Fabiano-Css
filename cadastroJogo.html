<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cadastroJogo.css">
    <title>Cadastro de Jogo</title>
</head>
<body>
    <header>
        <div class="titulo">
            <p>Cadastro de Jogos:</p>
        </div>
        <div class="logo">
            <img src="logo.png" alt="Logo" class="logo">
        </div>
    </header>

<input type="text" id="search" placeholder="Buscar jogo pelo título">
            <button onclick="buscarJogo()">Buscar</button>
    
    <div class="container">
        <h2>Cadastro Jogo:</h2>
        <input type="text" id="titulo" placeholder="Título do Jogo">
        <select id="genero">
            <option value="">Selecione um Gênero</option>
            <option value="Ação">Ação</option>
            <option value="RPG">Aventura</option>
            <option value="Aventura">RPG</option>
            <option value="Moba">MOBA</option>
            <option value="Simulacao">Simulação</option>
            <option value="Sobrevivencia">Sobrevivência</option>
        </select>
        <input type="number" id="preco" placeholder="Preço (R$)">
        <button onclick="cadastrarJogo()">Cadastrar</button>
    </div>

    <table border="1" style="width: 100%; margin-top: 20px; border-collapse: collapse; text-align: center;">
        <thead>
            <tr>
                <th>Título</th>
                <th>Gênero</th>
                <th>Preço</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-jogos">
            
        </tbody>
    </table>
    

    <footer>
        <p>&copy; 2024 GamesGalaxy. Todos os direitos reservados.</p>
        <div class="search-bar">
        </div>
    </footer>

    <script src="/style/cadastroJogo.js"></script>
</body>
</html>
