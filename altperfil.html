<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/altperfil.css">
    <title>Document</title>
</head>
<body>
    

<header class="header">
    <div class="logo">
        <img src="logo.png" alt="GamesGalaxy Logo">
    </div>
    <nav class="nav">
        <a href="home.html">Página Inicial</a>
        <a href="suporte.html">Suporte</a>
    </nav>
</header>


<main class="main-content">
    <h1>Alterar Perfil</h1>
    <div class="perfil-container">
        <div class="foto-perfil">
            <label for="foto">Alterar foto de perfil:</label>
            <input type="file" id="foto" name="foto" accept="image/*">
        </div>

        <div class="usuario-container">
            <label for="usuario">Alterar nome de usuário:</label>
            <input type="text" id="usuario" name="usuario" placeholder="Novo nome de usuário">
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="footer">
    <p>&copy; 2025 GamesGalaxy. Todos os direitos reservados.</p>
</footer>


</body>
</html>
