<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/altperfil.css">
    <link rel="stylesheet" href="style/altperfil.js">
    <title>Document</title>
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="logo.png" alt="GamesGalaxy Logo">
        </div>
        <nav class="nav">
            <a href="home.html">Página Inicial</a>
            <a href="perfil.html">Perfil</a>
            <a href="suporte.html">Suporte</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="alterar-perfil">
            <h2>Alterar Perfil</h2>
            
            <div class="foto-perfil">
                <label for="foto">Alterar foto de perfil:</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="campo">
                <label for="usuario">Alterar nome de usuário:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Novo nome de usuário">
            </div>

            <button class="botao">Salvar Alterações</button>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 GamesGalaxy. Todos os direitos reservados.</p>
    </footer>


</body>
</html>
